name: Anna Darpan Refresh Save Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh Anna Darpan token
        env:
          ANNA_REFRESH_TOKEN: ${{ secrets.ANNA_REFRESH_TOKEN }}
          ANNA_CLIENT_ID: ad-fci
        run: |
          python refresh_and_save.py

      - name: Update GitHub refresh-token secret
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_REFRESH_TOKEN: ${{ env.ANNA_REFRESH_TOKEN_NEW }}
        run: |
          printf '%s' "$NEW_REFRESH_TOKEN" | gh secret set ANNA_REFRESH_TOKEN

      - name: Verify
        run: |
          echo "Refresh token rotation and secret update completed successfully."
