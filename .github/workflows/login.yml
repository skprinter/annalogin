name: Anna Darpan Refresh Token Test

on:
  workflow_dispatch:

jobs:
  refresh-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Refresh Token Rotation
        env:
          ANNA_REFRESH_TOKEN: ${{ secrets.ANNA_REFRESH_TOKEN }}
          ANNA_CLIENT_ID: ad-fci
        run: |
          python refresh_test.py
