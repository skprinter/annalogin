name: Anna Darpan Token Refresh

on:
  workflow_dispatch:

  schedule:
    # रोज सकाळी 5:00 IST = 23:30 UTC (previous day)
    - cron: "30 23 * * *"

permissions:
  contents: read

jobs:
  refresh-token:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pynacl

      # --------------------------------------------------
      # 4. Refresh Anna Darpan token
      # --------------------------------------------------
      - name: Refresh Anna Darpan token
        env:
          ANNA_REFRESH_TOKEN: ${{ secrets.ANNA_REFRESH_TOKEN }}
          ANNA_CLIENT_ID: ad-fci
        run: |
          python refresh_test.py

      # --------------------------------------------------
      # 5. Update GitHub repository secrets
      # --------------------------------------------------
      - name: Update GitHub token secrets
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}

          ANNA_ACCESS_TOKEN: ${{ env.ANNA_ACCESS_TOKEN }}
          ANNA_REFRESH_TOKEN_NEW: ${{ env.ANNA_REFRESH_TOKEN_NEW }}

          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python update_github_secrets.py

      # --------------------------------------------------
      # 6. Verify workflow completed
      # --------------------------------------------------
      - name: Refresh completed
        run: |
          echo "Anna Darpan token refresh completed successfully."
          echo "Tokens were not printed to the workflow log."
